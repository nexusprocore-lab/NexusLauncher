<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Pro Launcher</title>
    <style>
        /* Modern Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '-apple-system', BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #010103;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            position: relative;
            perspective: 1000px;
        }

        /* Interactive Canvas Background */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* CINEMATIC HIGH-POWER INTRO SYSTEM */
        .intro-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #010103;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.4s cubic-bezier(0.76, 0, 0.24, 1), 
                        visibility 1.4s cubic-bezier(0.76, 0, 0.24, 1);
        }

        /* Kinetic Text Blast */
        .intro-logo {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 20%, #71717a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: scale(0.3) translateZ(0);
            filter: blur(20px);
            animation: kineticImpact 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
        }

        /* Energy Shockwave Ring */
        .shockwave {
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            opacity: 0;
            transform: scale(1);
            pointer-events: none;
            animation: blastWave 1.4s cubic-bezier(0.1, 0.8, 0.1, 1) forwards 0.35s;
        }

        /* Premium Minimalist Status Scanner */
        .loading-bar-container {
            width: 140px;
            height: 2px;
            background: rgba(255, 255, 255, 0.03);
            margin-top: 3rem;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            opacity: 0;
            animation: appleFadeIn 0.5s ease forwards 0.9s;
        }

        .loading-bar-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #ffffff, transparent);
            position: absolute;
            animation: runProgress 1.6s cubic-bezier(0.65, 0, 0.35, 1) forwards 1s;
        }

        /* Main Content UI Container */
        .card-perspective-wrapper {
            perspective: 1000px;
            z-index: 2;
            opacity: 0;
            transform: scale(0.85) translateZ(-150px);
            filter: blur(15px);
            transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 1.8s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 1.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Smooth Power Injection Reveal */
        .card-perspective-wrapper.loaded {
            opacity: 1;
            filter: blur(0px);
            transform: scale(1) translateZ(0);
        }

        .intro-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Glassmorphism Card with Inertial Transitions */
        .launcher-content {
            text-align: center;
            max-width: 300px;
            width: 100%;
            padding: 3.5rem 2.2rem;
            position: relative;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 36px;
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.85),
                        inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), 
                        box-shadow 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            transform-style: preserve-3d;
        }

        .title {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 0.4rem;
            background: linear-gradient(180deg, #ffffff 30%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transform: translateZ(40px);
        }

        .subtitle {
            font-size: 0.75rem;
            color: #52525b;
            margin-bottom: 2.8rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            transform: translateZ(25px);
        }

        /* Interactive Pill Button */
        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 1rem 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: #000000;
            background: #ffffff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            transform: translateZ(50px);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                        background-color 0.3s;
            box-shadow: 0 12px 35px rgba(255, 255, 255, 0.12);
        }

        .download-btn:hover {
            background: #f4f4f5;
            transform: translateZ(65px) scale(1.03);
            box-shadow: 0 20px 45px rgba(255, 255, 255, 0.25);
        }

        .download-btn:active {
            transform: translateZ(45px) scale(0.97);
        }

        /* SYSTEM KEYFRAMES */
        @keyframes kineticImpact {
            0% {
                opacity: 0;
                transform: scale(0.4) translateZ(0);
                filter: blur(20px);
            }
            30% {
                opacity: 1;
                filter: blur(0px);
            }
            70% {
                transform: scale(1.05) translateZ(0);
                filter: blur(0px);
                opacity: 1;
            }
            100% {
                transform: scale(1) translateZ(0);
                filter: blur(0px);
                opacity: 1;
            }
        }

        @keyframes blastWave {
            0% {
                width: 20px;
                height: 20px;
                opacity: 0;
                transform: scale(0.5);
                border-color: rgba(255, 255, 255, 0.9);
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            }
            15% {
                opacity: 1;
            }
            100% {
                width: 600px;
                height: 600px;
                opacity: 0;
                transform: scale(2.5);
                border-color: rgba(255, 255, 255, 0);
                box-shadow: 0 0 100px rgba(255, 255, 255, 0);
            }
        }

        @keyframes runProgress {
            0% { width: 0%; left: 0; }
            50% { width: 60%; }
            100% { width: 100%; }
        }

        @keyframes appleFadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="intro-container" id="introLoader">
        <div class="shockwave" id="shockwaveRing"></div>
        <h2 class="intro-logo" id="introText">Nexus Pro</h2>
        <div class="loading-bar-container">
            <div class="loading-bar-progress"></div>
        </div>
    </div>

    <canvas id="trippyCanvas"></canvas>

    <div class="card-perspective-wrapper" id="cardWrapper">
        <div class="launcher-content" id="mainCard">
            <h1 class="title">Nexus Pro</h1>
            <p class="subtitle">launcher</p>
            <a href="https://github.com/nexusprocore-lab/Nexusprolauncher/releases/download/optimzer/Nexus.exe" class="download-btn">Download</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('trippyCanvas');
        const ctx = canvas.getContext('2d');
        const mainCard = document.getElementById('mainCard');
        const cardWrapper = document.getElementById('cardWrapper');
        const introLoader = document.getElementById('introLoader');
        const introText = document.getElementById('introText');
        const shockwaveRing = document.getElementById('shockwaveRing');

        let particlesArray = [];
        let boxesArray = [];
        let hue = 210; // Majestic, high-end electric cyber blue
        let introComplete = false;

        // SEQUENCE CONTROLLER
        window.addEventListener('DOMContentLoaded', () => {
            // Apply dynamic color glowing highlights onto structural components instantly before blast
            setTimeout(() => {
                shockwaveRing.style.boxShadow = `0 0 40px hsl(${hue}, 100%, 60%)`;
                shockwaveRing.style.borderColor = `hsl(${hue}, 100%, 75%)`;
                introText.style.textShadow = `0 0 40px hsla(${hue}, 100%, 60%, 0.4)`;
            }, 300);

            // Phase into Main Execution
            setTimeout(() => {
                introLoader.classList.add('hidden');
                cardWrapper.classList.add('loaded');
                introComplete = true;
                
                // Explode massive greeting canvas bursts matching the exact closure of intro
                triggerIntroCanvasExplosion();
            }, 2700); 
        });

        // Resize handler
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // High precision tracking mouse object
        const mouse = {
            x: undefined,
            y: undefined,
            targetX: undefined,
            targetY: undefined
        }

        // Mouse Move Handling
        window.addEventListener('mousemove', function(event) {
            mouse.targetX = event.x;
            mouse.targetY = event.y;
            
            if (introComplete) {
                for (let i = 0; i < 2; i++) {
                    particlesArray.push(new Particle(event.x, event.y));
                }

                // High End 3D Parallax Calculations
                const cardRect = cardWrapper.getBoundingClientRect();
                const cardCenterX = cardRect.left + cardRect.width / 2;
                const cardCenterY = cardRect.top + cardRect.height / 2;
                
                const rotateX = -(event.y - cardCenterY) / (window.innerHeight / 2) * 14; 
                const rotateY = (event.x - cardCenterX) / (window.innerWidth / 2) * 14;

                mainCard.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                mainCard.style.boxShadow = `${-rotateY * 2}px ${rotateX * 2}px 60px rgba(0,0,0,0.8), 0 40px 90px rgba(0, 0, 0, 0.5)`;
            }
        });

        // Clear Parallax Angles on Leave
        window.addEventListener('mouseleave', () => {
            mainCard.style.transform = `rotateX(0deg) rotateY(0deg)`;
            mainCard.style.boxShadow = `0 40px 90px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.08)`;
        });

        // Kinetic Particle Blueprint
        class Particle {
            constructor(x, y, customSpeed = false) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 1.5;
                
                if (customSpeed) {
                    this.speedX = customSpeed.x;
                    this.speedY = customSpeed.y;
                } else {
                    this.speedX = Math.random() * 2 - 1;
                    this.speedY = Math.random() * 2 - 1;
                }
                this.color = 'hsla(' + hue + ', 100%, 70%, 0.7)';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.05) this.size -= 0.04;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Apple-style Organic Physics Box Blueprint
        class Box {
            constructor(startAnywhere = false) {
                this.size = Math.random() * 45 + 15; 
                this.x = Math.random() * canvas.width;
                this.y = startAnywhere ? Math.random() * canvas.height : -this.size; 
                this.speedY = Math.random() * 0.3 + 0.15; 
                
                this.swaySpeed = Math.random() * 0.01 + 0.005;
                this.swayAngle = Math.random() * Math.PI * 2;
                this.swayRadius = Math.random() * 0.6 + 0.2;

                this.angle = Math.random() * Math.PI * 2;
                this.baseRotationSpeed = Math.random() * 0.004 - 0.002;
                this.currentRotationSpeed = this.baseRotationSpeed;
                
                this.hueVal = hue;
                this.opacity = Math.random() * 0.2 + 0.05; 
            }
            update() {
                this.y += this.speedY;
                this.swayAngle += this.swaySpeed;
                this.x += Math.sin(this.swayAngle) * this.swayRadius;

                // Magnetic Field Vectors
                if (mouse.x !== undefined && mouse.y !== undefined && introComplete) {
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const forceRadius = 180; 

                    if (distance < forceRadius) {
                        const force = (forceRadius - distance) / forceRadius;
                        const pushX = (dx / distance) * force * 1.6;
                        const pushY = (dy / distance) * force * 1.1;
                        
                        this.x += pushX;
                        this.y += pushY;
                        this.currentRotationSpeed = this.baseRotationSpeed + (pushX * 0.02);
                    } else {
                        this.currentRotationSpeed += (this.baseRotationSpeed - this.currentRotationSpeed) * 0.05;
                    }
                }
                this.angle += this.currentRotationSpeed;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.shadowBlur = 25;
                ctx.shadowColor = 'hsl(' + this.hueVal + ', 100%, 65%)';
                
                ctx.fillStyle = 'hsla(' + this.hueVal + ', 100%, 65%,' + (this.opacity * 0.18) + ')';
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                
                ctx.strokeStyle = 'hsla(' + this.hueVal + ', 100%, 65%,' + this.opacity + ')';
                ctx.lineWidth = 1.2;
                ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);
                
                ctx.restore();
            }
        }

        // Epic Canvas Shockwave Spawn on Intro Completion
        function triggerIntroCanvasExplosion() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speedMagnitude = Math.random() * 6 + 2;
                const speed = {
                    x: Math.cos(angle) * speedMagnitude,
                    y: Math.sin(angle) * speedMagnitude
                };
                particlesArray.push(new Particle(centerX, centerY, speed));
            }
        }

        // Initialize background framework
        function initBoxes() {
            for (let i = 0; i < 14; i++) {
                boxesArray.push(new Box(true)); 
            }
        }
        initBoxes();

        function handleParticles() {
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                
                if (particlesArray[i].size <= 0.05) {
                    particlesArray.splice(i, 1);
                    i--;
                }
            }
        }

        function handleBoxes() {
            if (Math.random() < 0.008 && boxesArray.length < 18) {
                boxesArray.push(new Box(false));
            }

            for (let i = 0; i < boxesArray.length; i++) {
                boxesArray[i].update();
                boxesArray[i].draw();

                if (boxesArray[i].y > canvas.height + boxesArray[i].size || 
                    boxesArray[i].x < -boxesArray[i].size || 
                    boxesArray[i].x > canvas.width + boxesArray[i].size) {
                    boxesArray.splice(i, 1);
                    i--;
                }
            }
        }

        // Primary Frame Engine
        function animate() {
            if (mouse.targetX !== undefined) {
                if (mouse.x === undefined) {
                    mouse.x = mouse.targetX;
                    mouse.y = mouse.targetY;
                } else {
                    mouse.x += (mouse.targetX - mouse.x) * 0.08; 
                    mouse.y += (mouse.targetY - mouse.y) * 0.08;
                }
            }

            ctx.fillStyle = 'rgba(1, 1, 3, 0.14)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            handleBoxes();
            handleParticles();
            
            hue += 0.25; 
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
